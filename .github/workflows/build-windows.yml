name: Build Windows desktop app

# This is the real Windows build/packaging step for VEYRA. Development on
# this project happens on Linux (see VEYRA_SETUP.md), which can compile and
# unit-test the Rust core (including cross-checking the Windows-only code
# paths against the x86_64-pc-windows-gnu target) but cannot produce or run
# an actual Windows .msi/.exe. This workflow does that on a real
# windows-latest runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev build-essential
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build-windows:
    needs: [frontend-checks, rust-checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-windows-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
